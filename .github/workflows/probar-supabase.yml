name: Probar Supabase

on:
  pull_request:
    paths: ["js/config.js", "supabase/**", "tools/probar-comunidad/**", ".github/workflows/probar-supabase.yml"]
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save @supabase/supabase-js@2.99.3
      - run: node tools/probar-comunidad/real.mjs
