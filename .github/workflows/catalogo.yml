name: Actualizar catálogos

on:
  schedule:
    - cron: "30 3 * * *" # cada noche, 05:30 hora peninsular en verano
  workflow_dispatch:
    inputs:
      tiendas:
        description: "Tiendas a actualizar separadas por espacios (vacío = todas)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/catalogo.yml"]

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar catálogos
        run: node scripts/build-catalog.mjs ${{ github.event.inputs.tiendas }}
      - name: Guardar cambios
        run: |
          git config user.name "super-lista-bot"
          git config user.email "super-lista-bot@users.noreply.github.com"
          # Los catálogos recién descargados mandan: se ponen encima de lo último de main (sin conflictos de rebase).
          cp -r data /tmp/data-nueva
          git fetch -q origin main
          git reset -q --hard origin/main
          cp -r /tmp/data-nueva/. data/
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar catálogos de supermercados"
          git push origin HEAD:main
