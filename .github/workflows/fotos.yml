name: Fotos de recetas

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "candidatas o final"
        required: true
        default: "candidatas"
  push:
    branches: [main]
    paths: ["tools/fotos-*"]

permissions:
  contents: write

concurrency:
  group: fotos
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Elegir modo
        id: modo
        run: |
          m="${{ github.event.inputs.modo }}"
          if [ -z "$m" ]; then if [ -f tools/fotos-eleccion.json ]; then m=final; else m=candidatas; fi; fi
          echo "modo=$m" >> "$GITHUB_OUTPUT"
      - name: Buscar fotos
        run: node tools/fotos-recetas.mjs ${{ steps.modo.outputs.modo }}
      - name: Guardar candidatas en su rama
        if: steps.modo.outputs.modo == 'candidatas'
        run: |
          git config user.name "super-lista-bot"
          git config user.email "super-lista-bot@users.noreply.github.com"
          mv out/cand /tmp/cand
          git checkout --orphan fotos-candidatas
          git rm -rq --cached . && git clean -fdq
          cp -r /tmp/cand/. .
          git add -A
          git commit -qm "Fotos candidatas para las recetas"
          git push -f origin fotos-candidatas
          echo "::notice title=Resultado::$(ls *.jpg | wc -l) fotos candidatas"
      - name: Guardar fotos elegidas
        if: steps.modo.outputs.modo == 'final'
        run: |
          git config user.name "super-lista-bot"
          git config user.email "super-lista-bot@users.noreply.github.com"
          git add img/recetas data/recetas-fotos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -qm "Fotos reales de las recetas"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "::notice title=Resultado::$(ls img/recetas | wc -l) fotos de recetas"
