<div class="intro" id="intro" role="img" aria-label="Super Lista"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><clipPath id="introClip"><rect width="512" height="512" rx="112"/></clipPath></defs><rect width="512" height="512" rx="112" fill="#1f7a4d"/><g clip-path="url(#introClip)"><g class="i-cz"><g transform="translate(300,400)"><g class="i-cx"><g class="i-ct"><g transform="scale(.55) translate(-352,-428)"><path d="M118 150h40l38 178a28 28 0 0 0 27 22h139a28 28 0 0 0 27-21l30-121H176" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><circle cx="232" cy="404" r="24" fill="#fff"/><circle cx="352" cy="404" r="24" fill="#fff"/><path class="i-ck" d="M232 252l38 36 70-74" fill="none" stroke="#bfe8cf" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></g></g><g transform="translate(100,400)"><g class="i-px"><g class="i-pf"><g transform="translate(0,-92)"><g class="i-l2"><path d="M0 0 L0 92" stroke="#fff" stroke-width="19" stroke-linecap="round"/></g></g><g transform="translate(0,-92)"><g class="i-l1"><path d="M0 0 L0 92" stroke="#fff" stroke-width="19" stroke-linecap="round"/></g></g><path d="M0 -92 L0 -166" stroke="#fff" stroke-width="19" stroke-linecap="round"/><circle cx="2" cy="-202" r="23" fill="#fff"/><g transform="translate(0,-148)"><g class="i-ar"><path d="M0 0 L66 -4" stroke="#fff" stroke-width="19" stroke-linecap="round"/></g></g></g></g></g><g transform="translate(294,303)"><g class="i-kf"><path transform="scale(.55) translate(-286,-251)" d="M232 252l38 36 70-74" fill="none" stroke="#bfe8cf" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg></div>
<script>
// Animación del logo al abrir la app: una vez por sesión, se salta tocando y no sale con «reducir movimiento».
(() => {
  const el = document.getElementById("intro");
  let seen = false; try { seen = sessionStorage.getItem("superlista.intro") === "1"; sessionStorage.setItem("superlista.intro", "1"); } catch {}
  if (seen || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.remove(); return; }
  const end = () => { if (!el.isConnected) return; el.classList.add("out"); setTimeout(() => el.remove(), 320); };
  el.addEventListener("click", end);
  setTimeout(end, 3300);
})();
</script>
<div class="wrap">
  <section class="homescr" id="home" aria-label="Inicio" hidden>
    <div class="home-top"><div class="ht-txt"><p class="home-hi" id="homeHi">Hola</p><h1 id="homeName">Super Lista</h1></div>
      <button type="button" class="home-me" id="homeMe" hidden></button></div>
    <div class="home-ins" id="homeIns" hidden>
      <img src="icons/icon-192.png" alt="" width="44" height="44">
      <span class="hi-t"><b>Instala Super Lista</b><small>Ábrela como una app, también sin cobertura.</small></span>
      <button type="button" class="btn small" id="insGo">Instalar</button>
      <button type="button" class="hi-x" id="insLater" aria-label="Ahora no">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="hcards" id="hcards"></div>
    <div class="hdots" id="hdots" aria-hidden="true"></div>
    <p class="home-tip">Desliza para ver todas las secciones</p>
  </section>
  <header>
    <div class="top">
      <button class="listname" id="listBtn" type="button" aria-haspopup="dialog">
        <span id="listName">Mi lista</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="tools">
        <button class="icon pill" id="cookBtn" type="button" title="Recetas con lo que tienes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11v6a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6M2 11h1M21 11h1M9 7c0-1.5 1-2 1-3.5M13 7c0-1.5 1-2 1-3.5"/></svg>
          <span>Recetas</span>
        </button>
        <button class="icon" id="shopBtn" type="button" aria-pressed="false" title="Modo tienda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
        </button>
        <button class="icon" id="histBtn" type="button" title="Historial de compras">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
        </button>
      </div>
    </div>
    <div class="stores" id="stores" role="group" aria-label="Supermercado"></div>
    <div class="summary" id="summary" hidden></div>
  </header>
  <main id="list"></main>
  <div class="finish" id="finishWrap" hidden>
    <button class="btn" id="finishBtn" type="button">Terminar compra</button>
  </div>
  <section class="ideas alerts" id="alerts" aria-label="Avisos de precio" hidden></section>
  <section class="ideas deals" id="deals" aria-label="Bajadas de precio" hidden></section>
  <section class="ideas" id="ideas" aria-label="Ideas de recetas" hidden></section>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastUndo">Deshacer</button></div>
    <div class="favs" id="favs" aria-label="Lo que compras a menudo"></div>
    <div class="status" id="status" aria-live="polite">Escribe o dicta: «apunta leche, huevos y oreos»</div>
    <form class="bar" id="bar" autocomplete="off">
      <label class="vh" for="q">Qué quieres apuntar</label>
      <input type="text" id="q" placeholder="Apunta leche y huevos…" enterkeyhint="send" autocapitalize="off">
      <button class="round" type="button" id="scanBtn" title="Escanear código de barras">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>
      </button>
      <button class="round" type="button" id="micBtn" title="Dictar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="round primary" type="submit" title="Añadir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <button type="button" data-tab="home" aria-current="page"><span aria-hidden="true">✨</span>Inicio</button>
    <button type="button" data-tab="list"><span aria-hidden="true">🛒</span>Lista</button>
    <button type="button" data-tab="recipes"><span aria-hidden="true">🍳</span>Recetas</button>
    <button type="button" data-tab="plan"><span aria-hidden="true">📅</span>Menú</button>
    <button type="button" data-tab="pantry"><span aria-hidden="true">🏠</span>En casa</button>
    <button type="button" data-tab="history"><span aria-hidden="true">🧾</span>Compras</button>
  </nav>
</div>

<dialog id="sheet" class="sheet">
  <div class="sheet-in">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon" type="button" id="sheetClose" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="sheetBody"></div>
    <nav class="tabbar sheet-tabs" id="sheetTabs" aria-label="Secciones"></nav>
  </div>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
